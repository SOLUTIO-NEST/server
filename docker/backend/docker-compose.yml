services:
  backend:
    image: solutionest/solutio-server:${IMAGE_TAG:-latest}
    container_name: ${BACKEND_CONTAINER_NAME}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - solutio-network

networks:
  solutio-network:
    external: true
