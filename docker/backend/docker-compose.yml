services:
  backend:
    image: solutionest/solutio-server:${IMAGE_TAG:-latest}
    container_name: ${BACKEND_CONTAINER_NAME}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${SERVER_PORT:-8080} && echo -e \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - solutio-network

networks:
  solutio-network:
    external: true
