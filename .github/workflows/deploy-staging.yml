name: Deploy Backend to Staging

on:
  push:
    branches:
      - develop
      - chore/#36
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/solutio-server:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/solutio-server:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/solutio-server:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/solutio-server:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/solutio-server:staging

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/staging/docker-compose.yml"
          target: ~/solutio-deploy/staging/backend
          strip_components: 2

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/solutio-deploy/staging/backend
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            docker compose -p solutio-staging-backend pull
            docker compose -p solutio-staging-backend --env-file .env up -d
            docker image prune -f