services:
  db:
    image: postgres:16-alpine
    container_name: solutio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solutio
      POSTGRES_USER: solutio
      POSTGRES_PASSWORD: solutio1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solutio -d solutio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solutio-redis
    restart: unless-stopped
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
